name: Build JARVIS APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Deps
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev libbz2-dev libsqlite3-dev

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Build APK
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          echo "y" | sdkmanager --version || true
          yes | buildozer android debug || true
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          echo "SDK Dir $SDK_DIR"
          if [ -d "$SDK_DIR/cmdline-tools" ]; then
            echo "Accepting licenses..."
            yes | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --licenses || true
            yes | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --licenses || true
          fi
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: bin/*.apk
          if-no-files-found: error
